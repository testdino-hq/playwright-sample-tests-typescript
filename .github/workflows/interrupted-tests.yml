name: Run Playwright Tests (Interrupted Suite)

on:
  workflow_dispatch:

jobs:
  playwright-tests:
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4, 5]
        shardTotal: [5]
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.60.0-noble
    env:
      CI: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Each shard holds 20 of the 100 tests, and --workers=20 starts all 20 at once.
      # Every test then blocks for 180s, so when --global-timeout aborts the run at 60s
      # all 20 are still in flight and Playwright marks each one "interrupted".
      # The run exits non-zero by design, hence continue-on-error.
      - name: Run Interrupted Test Suite (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        continue-on-error: true
        run: >
          npx playwright test tests/test_data/interrupted.spec.ts
          --project=chromium
          --reporter=blob
          --workers=20
          --global-timeout=60000
          --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-interrupted-${{ matrix.shardIndex }}
          path: blob-report
          if-no-files-found: ignore
          retention-days: 1

  merge-reports:
    needs: playwright-tests
    if: always()
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-interrupted-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge reports
        run: npx playwright merge-reports --config=playwright.config.ts all-blob-reports

      - name: Upload merged HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-interrupted
          path: playwright-report
          retention-days: 14

      - name: Send report to TestDino
        run: |
          npx --yes tdpw ./playwright-report \
            --token="${{ secrets.TESTDINO_TOKEN }}" \
            --upload-html \
            --verbose
