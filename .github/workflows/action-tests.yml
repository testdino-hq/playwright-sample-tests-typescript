name: Run Playwright Tests (Actions Suite)

on:
  workflow_dispatch:

jobs:
  playwright-tests:
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3]
        shardTotal: [3]
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.60.0-noble
    env:
      CI: true
      TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
      TESTDINO_CI_RUN_ID: "gh-${{ github.run_id }}-${{ github.run_attempt }}"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Test data for the TestDino "Create Actions" feature (Skip / Quarantine / Tag only).
      #   --retries=0        failures here are deterministic, not flaky - retrying would
      #                      only slow the run and risk a "flaky" classification
      #   continue-on-error  50 of the 60 tests fail by design, so the run exits non-zero
      - name: Run Actions Test Suite (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        continue-on-error: true
        run: >
          npx tdpw test
          --ci-run-id "$TESTDINO_CI_RUN_ID"
          tests/test_data/action.spec.ts
          --project=chromium
          --workers=5
          --retries=0
          --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-action-${{ matrix.shardIndex }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14
