name: Run Playwright Tests (Mixed Suite)

on:
  workflow_dispatch:

jobs:
  playwright-tests:
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4, 5]
        shardTotal: [5]
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.60.0-noble
    env:
      CI: true
      TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
      TESTDINO_CI_RUN_ID: "gh-${{ github.run_id }}-${{ github.run_attempt }}"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # This suite mixes all four outcomes in a single run: 25 passed, 25 failed,
      # 25 flaky and 25 skipped.
      #   --retries=1        required, or the flaky quarter reports as failed
      #   continue-on-error  required, since the 25 failing tests make the run exit non-zero
      - name: Run Mixed Test Suite (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        continue-on-error: true
        run: >
          npx tdpw test
          --ci-run-id "$TESTDINO_CI_RUN_ID"
          tests/test_data/mixed.spec.ts
          --project=chromium
          --workers=5
          --retries=1
          --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-mixed-${{ matrix.shardIndex }}
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14
