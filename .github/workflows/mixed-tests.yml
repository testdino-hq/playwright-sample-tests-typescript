name: Run Playwright Tests (Mixed Suite)

on:
  workflow_dispatch:

jobs:
  playwright-tests:
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4, 5]
        shardTotal: [5]
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.60.0-noble
    env:
      CI: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # This suite mixes all four outcomes in a single run: 25 passed, 25 failed,
      # 25 flaky and 25 skipped.
      #   --retries=1        required, or the flaky quarter reports as failed
      #   continue-on-error  required, since the 25 failing tests make the run exit non-zero
      - name: Run Mixed Test Suite (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        continue-on-error: true
        run: >
          npx playwright test tests/test_data/mixed.spec.ts
          --project=chromium
          --workers=5
          --reporter=blob
          --retries=1
          --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-mixed-${{ matrix.shardIndex }}
          path: blob-report
          if-no-files-found: ignore
          retention-days: 1

  merge-reports:
    needs: playwright-tests
    if: always()
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: blob-report-mixed-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge reports
        run: npx playwright merge-reports --config=playwright.config.ts all-blob-reports

      - name: Upload merged HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report-mixed
          path: playwright-report
          retention-days: 14

      - name: Send report to TestDino
        run: |
          npx --yes tdpw ./playwright-report \
            --token="${{ secrets.TESTDINO_TOKEN }}" \
            --upload-html \
            --verbose
