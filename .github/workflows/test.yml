# .github/workflows/test.yml
# Runs on a daily schedule and can also be triggered manually from the Actions tab.
# Results are streamed to TestDino by the @testdino/playwright reporter
# (configured in playwright.config.ts). Every shard shares one TESTDINO_CI_RUN_ID,
# so TestDino groups all 5 shards into a single run.

name: Run Playwright tests

on:
  # Trigger on every push to main (i.e. when you commit and push).
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 09:00 IST (03:30 UTC) every morning. Scheduled runs always use the main branch.
    - cron: "30 3 * * *"

jobs:
  run-tests:
    name: Run Playwright shards
    runs-on: ubuntu-latest
    # Browsers + OS deps are pre-installed in the image. Keep the tag in sync with
    # the playwright version in package.json so the browser build matches the client.
    container: mcr.microsoft.com/playwright:v1.64.1-noble

    env:
      CI: true
      TESTDINO_TOKEN: ${{ secrets.TESTDINO_TOKEN }}
      TESTDINO_SERVER_URL: ${{ secrets.TESTDINO_SERVER_URL }}
      TESTDINO_CI_RUN_ID: "gh-${{ github.run_id }}-${{ github.run_attempt }}"

    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4, 5]
        shardTotal: [5]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: Create .env file
        run: |
          echo "USERNAME=${{ secrets.USERNAME }}" >> .env
          echo "PASSWORD=${{ secrets.PASSWORD }}" >> .env
          echo "NEW_PASSWORD=${{ secrets.NEW_PASSWORD }}" >> .env
          echo "FIRST_NAME=${{ secrets.FIRST_NAME }}" >> .env
          echo "STREET_NAME=${{ secrets.STREET_NAME }}" >> .env
          echo "CITY=${{ secrets.CITY }}" >> .env
          echo "STATE=${{ secrets.STATE }}" >> .env
          echo "COUNTRY=${{ secrets.COUNTRY }}" >> .env
          echo "ZIP_CODE=${{ secrets.ZIP_CODE }}" >> .env

      - name: Install dependencies
        run: npm ci

      # --workers=5 matches the other suite workflows (the plain `tdpw test` default
      # was 1 worker in CI, which made the full suite crawl). --retries=1 is a safety
      # net for transient network blips against the live demo site, not flaky tolerance.
      # Invoke the vendored @testdino/playwright CLI by PATH, not `npx tdpw`:
      # the npm `tdpw` package declares the same `tdpw` bin but only ships
      # upload/cache/last-failed (no `test`, no --ci-run-id). Which bin wins
      # node_modules/.bin is install-order luck, so address it directly.
      # Same reasoning as orchastration.yml's TDPW variable.
      - name: Run shard ${{ matrix.shardIndex }}
        run: >
          node node_modules/@testdino/playwright/bin/tdpw.js test
          --ci-run-id "$TESTDINO_CI_RUN_ID"
          --project=chromium
          --retries=1
          --workers=5
          --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}

      - name: Upload shard report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shardIndex }}
          path: ./playwright-report
          if-no-files-found: ignore
          retention-days: 14
